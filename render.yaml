services:
  - type: web
    name: souzoku-platform
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # 相続ステーション連携①の受信認証（値はダッシュボードで設定。無いと連携APIが常に 503）
      - key: INBOUND_API_KEY
        sync: false
      - key: INBOUND_HMAC_SECRET
        sync: false
      - key: NODE_ENV
        value: production
