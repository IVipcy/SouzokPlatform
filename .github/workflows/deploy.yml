# main に push すると Azure Container Apps へ自動デプロイする。
#
# Render が「push を検知して勝手にビルド・反映」していたのと同じことを、GitHub 側で行う。
#   1. Azure にログイン（OIDC。パスワードは GitHub に置かない）
#   2. Azure のクラウド上でコンテナイメージをビルド（PC に Docker は不要）
#   3. アプリのイメージを差し替えて反映
#
# NEXT_PUBLIC_* はブラウザに焼き込まれるため、実行時ではなく「ビルド時」に渡す必要がある。
# 手で流すときは docs/Azure移行手順書.md の STEP 5・6 と同じ内容。

name: Deploy to Azure

on:
  push:
    branches: [main]
  # 画面のボタンから手動でも流せるようにしておく（コードを変えずに再デプロイしたいとき用）
  workflow_dispatch:

# OIDC でのログインに必要
permissions:
  id-token: write
  contents: read

env:
  ACR: acrsouzoku0806
  RG: rg-souzoku
  APP: souzoku-platform

# 連続で push したときに古い方を打ち切る（同時に2つ流れてイメージが競合しないように）
concurrency:
  group: deploy-azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure にログイン
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: イメージをビルド（Azure 上で実行）
        run: |
          az acr build \
            --registry "$ACR" \
            --image "souzoku-platform:${{ github.sha }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            .

      - name: アプリを新しいイメージに差し替え
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/souzoku-platform:${{ github.sha }}"

      - name: 反映先の URL を表示
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### デプロイ完了 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "https://$FQDN" >> $GITHUB_STEP_SUMMARY
